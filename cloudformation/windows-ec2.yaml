AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ASRS lab - Windows Server 2022 server. Stock AMI, no user data: the SSM agent
  and EC2Launch v2 ship with the AMI, so nothing on the operating system is
  configured here. No local users or passwords are created.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceProfileName:
    Type: String
  InstanceType:
    Type: String
    Default: t3.small
  RootVolumeSize:
    Type: Number
    Default: 40
    MinValue: 30
    MaxValue: 200
    Description: Windows Server 2022 AMIs need at least 30 GiB.
  KmsKeyArn:
    Type: String
    Default: aws-managed
    Description: KMS key ARN for EBS, or aws-managed for the AWS-managed aws/ebs key.
  KeyPairName:
    Type: String
    Default: ""
    Description: >-
      Optional. Only needed if you want the EC2 console "Get Windows password"
      feature. SSM access does not need it.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: >-
      Public SSM parameter that resolves to the latest Windows Server 2022 AMI in
      the region.

  PinnedAmiId:
    Type: String
    Default: ""
    Description: >-
      AMI to keep using. The deploy workflow passes the current AMI on updates so
      a newer AMI release does not replace the server and erase your work. Empty
      uses LatestAmiId.

Conditions:
  UseLatestAmi: !Equals [!Ref PinnedAmiId, ""]
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, aws-managed]]
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [UseLatestAmi, !Ref LatestAmiId, !Ref PinnedAmiId]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroupId]
      Monitoring: false
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            KmsKeyId: !If [HasKmsKey, !Ref KmsKeyArn, !Ref AWS::NoValue]
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-windows" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Server, Value: windows }
        - { Key: OS, Value: WindowsServer2022 }
        - { Key: PatchGroup, Value: !Sub "${ProjectName}-windows" }

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  AvailabilityZone:
    Value: !GetAtt Instance.AvailabilityZone
  AmiId:
    Value: !If [UseLatestAmi, !Ref LatestAmiId, !Ref PinnedAmiId]
