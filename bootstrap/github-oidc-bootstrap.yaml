AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ASRS lab - one-time bootstrap. Deploy this once from your own machine with your
  IAM Identity Center administrator session. It creates the GitHub OIDC trust,
  an S3 bucket for packaged templates, a CloudFormation execution role that
  holds the infrastructure permissions, and two narrowly scoped roles that
  GitHub Actions can assume. No access keys are created.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub user or organisation that owns the repository (case-sensitive).
  GitHubRepo:
    Type: String
    Description: Repository name only, without the owner.
  ProjectName:
    Type: String
    Default: asrs-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: Must match ProjectName in cloudformation/main.yaml.
  LabStackName:
    Type: String
    Default: asrs-lab
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{0,100}$"
    Description: Name of the lab stack the GitHub roles may manage.
  DeployEnvironment:
    Type: String
    Default: lab
    Description: GitHub Environment used by deploy.yml.
  DestroyEnvironment:
    Type: String
    Default: lab-destroy
    Description: GitHub Environment used by destroy.yml.
  DefaultBranch:
    Type: String
    Default: main
    Description: Branch stop-start.yml runs from.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      false if this account already has the token.actions.githubusercontent.com
      OIDC provider (only one is allowed per account).

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  # --- Packaged nested templates --------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Holds only packaged CloudFormation templates; access logging not worth the cost.
          - id: CKV_AWS_21
            comment: Objects are regenerated by every deploy and expire after 30 days.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-packaged-templates
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: { aws:SecureTransport: "false" }

  # --- CloudFormation execution role ----------------------------------------
  # CloudFormation assumes this role to create the lab. The GitHub roles cannot
  # create EC2, IAM or KMS resources themselves; they can only ask
  # CloudFormation to act on the lab stack with this role.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              ec2:Create* and kms:CreateKey cannot be resource-scoped before the
              resource exists. EC2 writes are pinned to this region, and only
              CloudFormation in this account can assume the role.
    Properties:
      RoleName: !Sub "${ProjectName}-cfn-execution"
      Description: CloudFormation service role for the ASRS lab stack
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: lab-infrastructure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Ec2LabResources
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ReplaceRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateVpcEndpoint
                  - ec2:ModifyVpcEndpoint
                  - ec2:DeleteVpcEndpoints
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                  - ec2:ModifySecurityGroupRules
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:ModifyInstanceCreditSpecification
                  - ec2:MonitorInstances
                  - ec2:UnmonitorInstances
                  - ec2:AssociateIamInstanceProfile
                  - ec2:DisassociateIamInstanceProfile
                  - ec2:ReplaceIamInstanceProfileAssociation
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:ModifyVolume
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: "*"
                Condition:
                  StringEquals: { aws:RequestedRegion: !Ref AWS::Region }
              - Sid: PrivateDnsForInterfaceEndpoints
                Effect: Allow
                Action:
                  - route53:AssociateVPCWithHostedZone
                  - route53:DisassociateVPCFromHostedZone
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/*"
              - Sid: ResolvePublicAmiParameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*"
              - Sid: InstanceRolesUnderProjectPath
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}/*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}/*"
              - Sid: AttachOnlySsmCorePolicy
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}/*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
              - Sid: PassInstanceRolesToEc2
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}/*"
                Condition:
                  StringEquals: { iam:PassedToService: ec2.amazonaws.com }
              - Sid: OptionalEbsKmsKey
                Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:ListAliases
                Resource: "*"
              - Sid: ManageEbsKmsKey
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:PutKeyPolicy
                  - kms:EnableKeyRotation
                  - kms:GetKeyRotationStatus
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:ListResourceTags
                  - kms:UpdateKeyDescription
                  - kms:CreateAlias
                  - kms:DeleteAlias
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${ProjectName}-*"
              - Sid: UseKmsKeysForEbs
                Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals: { kms:ViaService: !Sub "ec2.${AWS::Region}.amazonaws.com" }
              - Sid: ReadPackagedTemplates
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  # --- GitHub deploy/destroy role --------------------------------------------
  # Only jobs that run in the approved GitHub Environments can assume it.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      Description: GitHub Actions deploy.yml and destroy.yml for the ASRS lab
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${DeployEnvironment}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${DestroyEnvironment}"
      Policies:
        - PolicyName: lab-stack-lifecycle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOnlyTheLabStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DetectStackDrift
                  - cloudformation:DescribeStackDriftDetectionStatus
                  - cloudformation:DescribeStackResourceDrifts
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LabStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LabStackName}-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
              - Sid: AccountWideReadOnlyCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: HandStackWorkToTheExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              - Sid: UploadPackagedTemplates
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ListArtifactBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ReportStatusAndLeftovers
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeAddresses
                  - ec2:DescribeVpcs
                  - ec2:DescribeNetworkInterfaces
                  - ssm:DescribeInstanceInformation
                Resource: "*"
              - Sid: ResolvePublicAmiParameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  # --- GitHub stop/start role ------------------------------------------------
  # Stop and start need no approval gate, so this role can do nothing else.
  GitHubOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-operator"
      Description: GitHub Actions stop-start.yml for the ASRS lab
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${DefaultBranch}"
      Policies:
        - PolicyName: lab-power-state
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadLabStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LabStackName}/*"
              - Sid: StopStartOnlyLabInstances
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals: { aws:ResourceTag/Project: !Ref ProjectName }
              - Sid: DescribeState
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ssm:DescribeInstanceInformation
                Resource: "*"
              - Sid: StartInstancesWithCustomerManagedKeyVolumes
                Effect: Allow
                Action: [kms:CreateGrant, kms:Decrypt, kms:GenerateDataKeyWithoutPlaintext, kms:ReEncrypt*]
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals: { kms:ViaService: !Sub "ec2.${AWS::Region}.amazonaws.com" }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

Outputs:
  AwsRegion:
    Description: Set as repository variable AWS_REGION
    Value: !Ref AWS::Region
  DeployRoleArn:
    Description: Set as repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  OperatorRoleArn:
    Description: Set as repository variable AWS_OPERATOR_ROLE_ARN
    Value: !GetAtt GitHubOperatorRole.Arn
  CfnExecutionRoleArn:
    Description: Set as repository variable CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CfnExecutionRole.Arn
  ArtifactBucketName:
    Description: Set as repository variable ARTIFACT_BUCKET
    Value: !Ref ArtifactBucket
